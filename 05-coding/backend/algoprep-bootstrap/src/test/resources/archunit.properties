# ArchUnit - cau hinh cho KHUNG BASE.
#
# archRule.failOnEmptyShould=false
#   Mac dinh cua ArchUnit tu 1.0 la FAIL khi mot luat khong khop class nao, de bat luat viet sai
#   package. O khung base, nam module nghiep vu chua co class nao ngoai package-info
#   (DEC-2026-0901-backend-base-architecture diem 2), nen phan lon luat khop rong mot cach hop le.
#
#   DAY LA NO KY THUAT CO THOI HAN: khi ca sau module da co class nghiep vu, DOI DONG NAY THANH
#   true. De nguyen false vinh vien nghia la mot luat viet sai ten package se im lang mai mai -
#   dung kieu hong ma bo test nay ton tai de chan. Xem 05-coding/backend/README.md muc no ky thuat.
archRule.failOnEmptyShould=false
