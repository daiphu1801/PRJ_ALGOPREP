name: algoprep-deploy

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:?Set APP_HOST}
      CADDY_TLS: ${CADDY_TLS:-}
    ports:
      - "${HTTP_BIND:-0.0.0.0:80}:80"
      - "${HTTPS_BIND:-0.0.0.0:443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: worker,outbox,maintenance,prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/algoprep
      SPRING_DATASOURCE_USERNAME: algoprep
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DB_POOL_SIZE:-18}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: algoprep
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      SPRING_MAIL_HOST: ${SMTP_HOST:-}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT: "5000"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT: "5000"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT: "5000"
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      ALGOPREP_MAIL_FROM: ${MAIL_FROM:-}
      ALGOPREP_SECURITY_JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      ALGOPREP_SECURITY_JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      ALGOPREP_BOOTSTRAP_ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ALGOPREP_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ALGOPREP_OAUTH_REDIRECT_BASE_URL: ${APP_ORIGIN:?Set APP_ORIGIN}
      ALGOPREP_OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      ALGOPREP_OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      ALGOPREP_OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      ALGOPREP_OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      ALGOPREP_AI_OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ALGOPREP_AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-}
      ALGOPREP_AI_ALLOWED_MODELS: ${AI_ALLOWED_MODELS:-}
      ALGOPREP_WORKER_ENGINE_URL: http://go-judge:5050
      JUDGE_WEBSOCKET_ALLOWED_ORIGINS: ${APP_ORIGIN:?Set APP_ORIGIN}
      JUDGE_AUTOSCALE_MAX_WORKERS: ${JUDGE_WORKERS:-2}
      ALGOPREP_MINIO_ENDPOINT: http://minio:9000
      ALGOPREP_MINIO_PUBLIC_ENDPOINT: ${APP_ORIGIN:?Set APP_ORIGIN}
      ALGOPREP_MINIO_ACCESS_KEY: algoprep
      ALGOPREP_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      LOGGING_LEVEL_COM_ALGOPREP: INFO
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3; head -n 1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 4s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      go-judge:
        condition: service_healthy

  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: algoprep
      POSTGRES_USER: algoprep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "algoprep", "-d", "algoprep"]
      interval: 5s
      timeout: 4s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 4s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.2.9-management-alpine
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: algoprep
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 8s
      retries: 15

  minio:
    # Mirror of the upstream community image with matching amd64 root filesystem layers.
    image: ${MINIO_IMAGE:-ghcr.io/projekt-manager-org/minio@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: algoprep
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 4s
      retries: 20

  minio-init:
    image: ${MINIO_IMAGE:-ghcr.io/projekt-manager-org/minio@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2}
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 algoprep "$$MINIO_ROOT_PASSWORD"
        for bucket in algoprep-testcases algoprep-avatars; do
          mc mb --ignore-existing "local/$$bucket"
          mc anonymous set none "local/$$bucket"
        done

  go-judge:
    image: ${JUDGE_IMAGE:?Set JUDGE_IMAGE}
    restart: unless-stopped
    privileged: true
    cgroup: host
    shm_size: 256m
    command:
      - -http-addr=0.0.0.0:5050
      - -parallelism=${JUDGE_PARALLELISM:-2}
      - -output-limit=67108864
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/5050; printf 'GET /version HTTP/1.0\r\n\r\n' >&3; head -n 1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 4s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  caddy-data:
  caddy-config:
