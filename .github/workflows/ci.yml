# AlgoPrep — CI.
#
# Chay dung hai cong chat luong ma CLAUDE.md muc Rules (G-CHECK) va
# 01-rd/system/SYS0301_environment.md muc 4 bat buoc:
#   - 05-coding/frontend/  ->  pnpm check      (typecheck + lint + vitest)
#   - 05-coding/backend/   ->  ./mvnw verify   (Spotless, Checkstyle, SpotBugs, JaCoCo, ArchUnit)
#
# Hai job doc lap va CHAY THEO PATH FILTER: sua tai lieu thi khong job nao chay, sua frontend thi
# khong build backend. Ly do khong phai tiet kiem phut CI ma la tin hieu: mot job do phai co nghia
# la "thu vua sua bi hong", khong phai "co gi do o dau do".

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]
  # Cho phep chay tay khi can (vi du sau khi doi cau hinh CI ma khong doi ma nguon).
  workflow_dispatch:

# Push lien tiep vao cung mot branch thi huy lan chay cu. Tren main thi KHONG huy — lich su ket qua
# cua main la thu dung de tra nguoc khi tim commit lam do build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Xac dinh phan nao thay doi. Tach thanh job rieng thay vi dung `paths:` o muc
  # `on:` — vi `paths:` lam CA workflow bi SKIP, va mot required check bi skip thi
  # branch protection coi nhu "chua chay" chu khong phai "da qua", nen PR bi treo.
  # Cach nay luon co job chay, chi noi dung ben trong la co dieu kien.
  # ---------------------------------------------------------------------------
  changes:
    name: Phat hien thay doi
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
      judge: ${{ steps.filter.outputs.judge }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Loc theo duong dan
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            frontend:
              - '05-coding/frontend/**'
              - '05-coding/package.json'
              - '05-coding/pnpm-lock.yaml'
              - '05-coding/pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            backend:
              - '05-coding/backend/**'
              - '05-coding/database/init/**'
              - '05-coding/judge-engine/**'
              - '05-coding/docker-compose.worker-sandbox.yml'
              - '.github/ci/start-backend-test-services.sh'
              - '.github/workflows/ci.yml'
            infrastructure:
              - '.github/**'
              - '05-coding/docker-compose*.yml'
              - '05-coding/*/Dockerfile'
              - '05-coding/database/init/**'
              - '05-coding/deploy/**'
              - '05-coding/judge-engine/**'
              - '05-coding/k6/**'
            judge:
              - '05-coding/judge-engine/**'

  # ---------------------------------------------------------------------------
  # Frontend — pnpm check
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (pnpm check)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 05-coding
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # pnpm phai cai TRUOC setup-node, vi `cache: pnpm` cua setup-node can pnpm da ton tai de
      # tim duoc store path.
      - name: Cai pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          # Khong pin so o day: doc tu `packageManager` trong 05-coding/package.json, nen chi co
          # MOT cho khai phien ban pnpm. Hai cho la hai cho de lech nhau.
          #
          # `package_json_file` la BAT BUOC o repo nay: mac dinh action doc package.json o GOC repo,
          # va repo nay KHONG co package.json o goc (workspace pnpm nam o 05-coding/). Thieu dong
          # nay thi action do voi "No pnpm version is specified".
          # Luu y: `defaults.run.working-directory` khong ap cho action, chi ap cho buoc `run`.
          package_json_file: 05-coding/package.json
          run_install: false

      - name: Cai Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # >= 20.9 LTS theo 01-rd/system/SYS0301_environment.md muc 1. Dung 22 LTS cho CI.
          node-version: 22
          cache: pnpm
          cache-dependency-path: 05-coding/pnpm-lock.yaml

      - name: Cai dependency
        # --frozen-lockfile: lockfile lech package.json thi DO, khong tu sua. Day la cach duy nhat
        # CI phat hien duoc mot dependency duoc them ma quen commit lockfile.
        run: pnpm install --frozen-lockfile

      - name: pnpm check (typecheck + lint + vitest)
        run: pnpm check

      - name: Build Next.js production bundle
        env:
          NEXT_PUBLIC_MOCK_DATA: 'false'
          NEXT_PUBLIC_API_BASE_URL: /api/v1
          NEXT_PUBLIC_WS_BASE_URL: /ws
        run: pnpm build

      - name: Pack the standalone frontend
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/frontend-release"
          cp -a frontend/.next/standalone/. "$RUNNER_TEMP/frontend-release/"
          cp -a frontend/.next/static "$RUNNER_TEMP/frontend-release/frontend/.next/"
          cp -a frontend/public "$RUNNER_TEMP/frontend-release/frontend/"
          tar -C "$RUNNER_TEMP/frontend-release" -czf "$RUNNER_TEMP/frontend-standalone.tgz" .
      - name: Save the built frontend
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: frontend-standalone
          path: ${{ runner.temp }}/frontend-standalone.tgz
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Backend — ./mvnw verify
  #
  # KHONG can service container: profile `test` loai tru autoconfigure cua
  # PostgreSQL/Redis/RabbitMQ (05-coding/backend/algoprep-bootstrap/src/test/resources/
  # application-test.yml), co chu dich de cong cho ra cung mot ket qua o may lap trinh vien va o CI.
  # Khi module dau tien co Entity JPA that, test tich hop se dung Testcontainers — Docker co san
  # tren ubuntu-latest nen job nay khong phai doi cau hinh luc do.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (mvnw verify)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        working-directory: 05-coding/backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Cai JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          # 21 chu khong phai 17 hay 25: DEC-2026-0820-stack-versions pin Java 21 LTS, va POM cha
          # co maven-enforcer chan JDK ngoai [21,26) nen sai phien ban la do ngay o buoc validate.
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Prepare integration test services
        working-directory: .
        run: bash .github/ci/start-backend-test-services.sh

      - name: mvnw verify
        # -B khong mau, khong interactive. Khong dung -q: output cua cong chat luong CHINH LA thu
        # can doc khi job do, va "bao PASS khong kem output thi khong tinh" (CLAUDE.md muc Rules).
        env:
          JUDGE_GO_JUDGE_BASE_URL: http://127.0.0.1:5055
        run: ./mvnw -B verify

      - name: Stop the integration test sandbox
        if: always()
        working-directory: 05-coding
        run: docker compose -f docker-compose.worker-sandbox.yml down

      - name: Save the verified executable JAR
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: backend-jar
          path: 05-coding/backend/algoprep-bootstrap/target/algoprep-bootstrap-*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Tai bao cao khi that bai
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: backend-reports
          # surefire cho test that bai, checkstyle/spotbugs cho vi pham cong tinh, jacoco cho do
          # bao phu. Khong co chung thi doc log tho de doan, va doan thi mat mot vong CI nua.
          path: |
            05-coding/backend/**/target/surefire-reports/**
            05-coding/backend/**/target/checkstyle-result.xml
            05-coding/backend/**/target/spotbugsXml.xml
            05-coding/backend/**/target/site/jacoco/**
          retention-days: 7
          if-no-files-found: ignore

  infrastructure:
    needs: [changes, frontend, backend]
    if: always() && needs.changes.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.infrastructure == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate workflows and CI Gate
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          shellcheck .github/ci/*.sh
          bash .github/ci/test-ci-gate.sh
      - name: Validate Compose
        working-directory: 05-coding
        run: |
          docker compose --env-file .env.example config --quiet
          for compose in docker-compose.worker-sandbox.yml docker-compose.sonarqube.yml docker-compose.zap-gui.yml; do
            docker compose --env-file .env.example -f "$compose" config --quiet
          done
          docker compose --env-file deploy/.env.smoke -f deploy/compose.yml -f deploy/compose.smoke.yml config --quiet
          docker compose --env-file deploy/.env.smoke -f deploy/compose.yml config --quiet
      - name: Download the standalone frontend
        if: (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true') && needs.frontend.result == 'success'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: frontend-standalone
          path: ${{ runner.temp }}/algoprep-artifacts
      - name: Build frontend image
        if: (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true') && needs.frontend.result == 'success'
        run: docker build -f 05-coding/frontend/Dockerfile "$RUNNER_TEMP/algoprep-artifacts"
      - name: Download backend JAR
        if: (github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true') && needs.backend.result == 'success'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: backend-jar
          path: ${{ runner.temp }}/algoprep-backend
      - name: Build backend image
        if: (github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true') && needs.backend.result == 'success'
        run: docker build -f 05-coding/backend/Dockerfile "$RUNNER_TEMP/algoprep-backend"
      - name: Build judge toolchain
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.judge == 'true'
        run: docker build 05-coding/judge-engine

  gate:
    name: CI Gate
    if: always()
    needs: [changes, frontend, backend, infrastructure]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Require every applicable check
        env:
          EVENT: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          INFRASTRUCTURE_CHANGED: ${{ needs.changes.outputs.infrastructure }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure.result }}
        run: |
          bash .github/ci/ci-gate.sh "$EVENT" "$CHANGES_RESULT" \
            frontend "$FRONTEND_CHANGED" "$FRONTEND_RESULT" \
            backend "$BACKEND_CHANGED" "$BACKEND_RESULT" \
            infrastructure "$INFRASTRUCTURE_CHANGED" "$INFRASTRUCTURE_RESULT"
