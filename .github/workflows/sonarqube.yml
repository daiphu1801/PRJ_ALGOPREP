name: SonarQube

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    if: vars.SONAR_ENABLED == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 05-coding/backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepare integration test services
        working-directory: .
        run: bash .github/ci/start-backend-test-services.sh
      - name: Build and analyze backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          JUDGE_GO_JUDGE_BASE_URL: http://127.0.0.1:5055
        run: >-
          ./mvnw -B install
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.2.0.4988:sonar
          -Dsonar.projectKey=algoprep-backend
          "-Dsonar.host.url=${SONAR_HOST_URL}"
          -Dsonar.qualitygate.wait=true

  frontend:
    if: vars.SONAR_ENABLED == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 05-coding
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: 05-coding/package.json
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: 05-coding/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate frontend coverage
        run: pnpm --filter frontend exec vitest run --coverage
      - name: Analyze frontend
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: 05-coding/frontend
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
