name: SonarQube

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    if: vars.SONAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-coding/backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and analyze backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: >-
          ./mvnw -B install
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.2.0.4988:sonar
          -Dsonar.projectKey=algoprep-backend
          -Dsonar.host.url=${SONAR_HOST_URL}
          -Dsonar.qualitygate.wait=true

  frontend:
    if: vars.SONAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-coding
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: 05-coding/package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: 05-coding/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate frontend coverage
        run: pnpm --filter frontend exec vitest run --coverage
      - name: Analyze frontend
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        with:
          projectBaseDir: 05-coding/frontend
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
